<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Bar chart: battery life with ANC on for the Sony WH-1000XM6 (30 hours, 459.99 dollars list), Bose QuietComfort Ultra 2nd Gen (30 hours, 449 dollars), Sennheiser Momentum 4 (60 hours, 379.95 dollars), JBL Tour One M3 (40 hours, 349 dollars), and Anker Soundcore Space Q45 (50 hours, 149.99 dollars)">
  <rect x="8" y="8" width="744" height="384" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="28" y="44" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Battery life with ANC on</text>
  <text x="28" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Hours per charge — and what each pick costs</text>

  <!-- Sony WH-1000XM6: 30 hrs, $459.99 list -->
  <text x="28" y="116" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Sony WH-1000XM6</text>
  <rect x="250" y="100" width="190" height="26" rx="4" fill="#2563eb"/>
  <text x="448" y="118" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">30 hrs</text>
  <text x="732" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="end">$459.99</text>

  <!-- Bose QuietComfort Ultra (2nd Gen): 30 hrs, $449 list -->
  <text x="28" y="168" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Bose QC Ultra (2nd Gen)</text>
  <rect x="250" y="152" width="190" height="26" rx="4" fill="#2563eb"/>
  <text x="448" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">30 hrs</text>
  <text x="732" y="170" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="end">$449</text>

  <!-- Sennheiser Momentum 4: 60 hrs, $379.95 list -->
  <text x="28" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Sennheiser Momentum 4</text>
  <rect x="250" y="204" width="380" height="26" rx="4" fill="#f08804"/>
  <text x="638" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">60 hrs</text>
  <text x="732" y="222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="end">$379.95</text>

  <!-- JBL Tour One M3: 40 hrs, $349 list -->
  <text x="28" y="272" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">JBL Tour One M3</text>
  <rect x="250" y="256" width="253" height="26" rx="4" fill="#2563eb"/>
  <text x="511" y="274" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">40 hrs</text>
  <text x="732" y="274" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="end">$349</text>

  <!-- Anker Soundcore Space Q45: 50 hrs, $149.99 list -->
  <text x="28" y="324" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Soundcore Space Q45</text>
  <rect x="250" y="308" width="317" height="26" rx="4" fill="#2563eb"/>
  <text x="575" y="326" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">50 hrs</text>
  <text x="732" y="326" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="end">$149.99</text>

  <text x="28" y="362" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#64748b">Battery figures as cited in the guide (ANC on). ANC off: XM6 40, Bose 45, Momentum 4 60, JBL 70, Q45 65 hrs.</text>
  <text x="28" y="382" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#64748b">Prices are manufacturer list prices, November 2026. Original chart by SmartGearPick.</text>
</svg>
