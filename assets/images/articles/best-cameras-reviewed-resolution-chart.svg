<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="760" height="320" role="img" aria-label="Bar chart: sensor resolution in megapixels for the Sony A7 IV (33 megapixels, about 1,999.99 dollars), Canon EOS R6 Mark II (24.2 megapixels, about 1,999 dollars), and Fujifilm X-T5 (40.2 megapixels, 1,999.95 dollars)">
  <rect x="8" y="8" width="744" height="304" rx="12" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="28" y="44" font-family="Arial, Helvetica, sans-serif" font-size="19" font-weight="700" fill="#0f172a">Sensor resolution — megapixels</text>
  <text x="28" y="68" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Megapixels per body — and what each body costs</text>

  <!-- Sony A7 IV: 33 MP, ~$1,999.99 -->
  <text x="28" y="116" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Sony A7 IV</text>
  <rect x="250" y="100" width="231" height="26" rx="4" fill="#2563eb"/>
  <text x="489" y="112" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">33 MP</text>
  <text x="732" y="118" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="end">~$1,999.99</text>

  <!-- Canon EOS R6 Mark II: 24.2 MP, ~$1,999 -->
  <text x="28" y="168" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Canon EOS R6 Mark II</text>
  <rect x="250" y="152" width="169" height="26" rx="4" fill="#2563eb"/>
  <text x="427" y="170" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">24.2 MP</text>
  <text x="732" y="170" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="end">~$1,999</text>

  <!-- Fujifilm X-T5: 40.2 MP, $1,999.95 -->
  <text x="28" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="600" fill="#0f172a">Fujifilm X-T5</text>
  <rect x="250" y="204" width="281" height="26" rx="4" fill="#f08804"/>
  <text x="539" y="222" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#1e3a8a">40.2 MP</text>
  <text x="732" y="222" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#0f172a" text-anchor="end">$1,999.95</text>

  <text x="28" y="272" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">All three bodies cost about $1,999 — resolution is what differs.</text>
  <text x="28" y="292" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#64748b">Prices as cited in the guide, November 2026. Original chart by SmartGearPick.</text>
</svg>
