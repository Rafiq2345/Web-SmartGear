<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-label="Battery life per charge for the four health-monitoring smartwatches">
  <rect width="760" height="360" fill="#ffffff"/>
  <text x="28" y="34" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="bold" fill="#0f172a">Battery life per charge</text>
  <text x="28" y="58" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#64748b">Days per charge — and what each watch costs</text>
  <text x="28" y="88" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#64748b">WATCH</text>
  <text x="250" y="88" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#64748b">BATTERY</text>
  <text x="732" y="88" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="bold" fill="#64748b" text-anchor="end">PRICE</text>
  <text x="28" y="116" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0f172a">Apple Watch Series 10</text>
  <rect x="250" y="103" width="8" height="26" fill="#2563eb"/>
  <text x="266" y="116" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">~1 day</text>
  <text x="732" y="116" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="end">~$229–$299</text>
  <text x="28" y="168" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0f172a">Samsung Galaxy Watch 7</text>
  <rect x="250" y="155" width="12" height="26" fill="#2563eb"/>
  <text x="270" y="168" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">~1.5 days</text>
  <text x="732" y="168" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="end">~$299</text>
  <text x="28" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0f172a">Garmin Venu 3</text>
  <rect x="250" y="207" width="112" height="26" fill="#2563eb"/>
  <text x="370" y="220" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">14 days</text>
  <text x="732" y="220" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="end">$299.99 sale</text>
  <text x="28" y="272" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#0f172a">Withings ScanWatch 2</text>
  <rect x="250" y="259" width="280" height="26" fill="#f08804"/>
  <text x="538" y="272" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" fill="#1e3a8a">35 days</text>
  <text x="732" y="272" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" fill="#0f172a" text-anchor="end">$369.95</text>
  <text x="28" y="312" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">Apple Watch Series 10 lasts 18–24 hours (about 1 day); Galaxy Watch 7 30–40 hours (about 1.5 days).</text>
  <text x="28" y="332" font-family="Arial, Helvetica, sans-serif" font-size="11" fill="#64748b">Prices as cited in the guide, November 2026. Series 10 launched at $399. Original chart by SmartGearPick.</text>
</svg>
