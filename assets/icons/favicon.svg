<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sgp-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="sgp-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Rounded Square Container -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#sgp-grad)" filter="url(#sgp-shadow)"/>
  <!-- Lightning Bolt Icon -->
  <polygon points="35 10 19 32 31 32 29 54 45 28 33 28 35 10" fill="#ffffff"/>
</svg>

